apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutation-sudoku
  namespace: ga-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mutation-sudoku
  template:
    metadata:
      labels:
        app: mutation-sudoku
    spec:
      containers:
        - name: mutation-sudoku
          image: mutation-sudoku
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mutation-sudoku
  namespace: ga-pipeline
spec:
  selector:
    app: mutation-sudoku
  ports:
    - port: 8000
      targetPort: 8000