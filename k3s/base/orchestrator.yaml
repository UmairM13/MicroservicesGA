apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ga-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: orchestrator
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: FITNESS_URL
              value: "http://fitness-sudoku:8000"
            - name: GENERATOR_URL
              value: "http://generator-sudoku:8000"
            - name: CROSSOVER_URL
              value: "http://crossover-sudoku:8000"
            - name: MUTATION_URL
              value: "http://mutation-sudoku:8000"
            - name: SELECTOR_URL
              value: "http://selection:8000"
            - name: MIGRATION_URL
              value: "http://migration:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: ga-pipeline
spec:
  type: NodePort
  selector:
    app: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000