apiVersion: apps/v1
kind: Deployment
metadata:
  name: selection
  namespace: ga-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selection
  template:
    metadata:
      labels:
        app: selection
    spec:
      containers:
        - name: selection
          image: selection
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: selection
  namespace: ga-pipeline
spec:
  selector:
    app: selection
  ports:
    - port: 8000
      targetPort: 8000